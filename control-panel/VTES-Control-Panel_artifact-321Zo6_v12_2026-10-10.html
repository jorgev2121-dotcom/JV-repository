<style>
:root{--bg:#f4f6f9;--panel:#fff;--line:#d7dee7;--ink:#111827;--muted:#5b6b80;--accent:#2f6fed;--good:#0e8f6b;--good-bg:#e3f6ee;--warn:#b5760a;--warn-bg:#fbf0dd;--bad:#c23b3b;--bad-bg:#fce7e7;--pill-bg:#eef1f6;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--serif:'Playfair Display',Georgia,serif}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;font-size:14px}
.header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
h1{font-family:var(--mono);font-size:18px;font-weight:700;margin:0 0 2px}
.freshness{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 8px;line-height:1.4}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{font-family:var(--mono);font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--muted);background:none;border:none;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:900px;margin:0 auto;padding:16px 16px 60px}
.pane{display:none}.pane.active{display:block}
.lead{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:65ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card h3{font-size:14.5px;margin:0 0 4px;font-weight:600}
.card p{font-size:13px;color:var(--muted);margin:0 0 8px;line-height:1.5}
.kv{font-family:var(--mono);font-size:12px;word-break:break-word}
.pill{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;text-transform:uppercase}
.pill.live,.pill.approved{color:var(--good);background:var(--good-bg)}
.pill.wait,.pill.deferred{color:var(--warn);background:var(--warn-bg)}
.pill.off{color:var(--muted);background:var(--pill-bg)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button.act{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:36px}
button.act.approve{background:var(--good);border-color:var(--good);color:#04220f}
button.act.defer{background:transparent;border-color:var(--warn);color:var(--warn)}
button.act.details{background:transparent;color:var(--muted)}
.detail,.commentbox{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted);line-height:1.55}
.detail.open,.commentbox.open{display:block}
.commentbox textarea{width:100%;min-height:56px;font-family:var(--sans);font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px}
.saved-note{font-size:11px;color:var(--good);margin-top:5px;display:none}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono);text-align:right}
.flagnote{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:7px;padding:8px 10px;margin:8px 0}

.menu h2{font-family:var(--serif);font-size:26px;text-align:center;margin:0 0 2px}

.dish{display:flex;align-items:baseline;gap:6px;width:100%;background:none;border:none;color:var(--ink);cursor:pointer;padding:9px 0;text-align:left;font-family:var(--sans);font-size:15px;min-height:44px}
.dish:hover .dn{color:var(--accent)}
.dn{font-weight:600}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.dp{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dd{display:block;font-size:12px;color:var(--muted);margin:-4px 0 4px;font-style:italic}
.linkrow a{color:var(--accent);word-break:break-all}

.bk{flex:1;min-width:150px;padding:12px;border-radius:9px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;font-family:var(--sans)}
.bk.on.ready{border-color:var(--good);background:var(--good-bg);color:var(--good)}

#alertbar .al{background:var(--bad);color:#fff;padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}

.st-success{color:var(--good)}.st-failed{color:var(--bad)}.st-pending{color:var(--warn)}

.lg{display:inline-flex;align-items:center;gap:6px}.lg i{width:12px;height:12px;border-radius:50%;background:var(--st);display:inline-block}

details.hand{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}details.hand summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);min-height:28px}

.gauge .fill{position:absolute;left:0;top:0;bottom:0;background:var(--st);opacity:.85;transition:width .6s}
.gauge .notch{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
.gauge span{position:relative;display:block;text-align:center;font-family:var(--mono);font-size:12px;font-weight:700;line-height:22px;color:var(--ink);text-shadow:0 0 3px var(--panel)}

.apprbox input{font-size:14px;padding:4px;margin:4px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px}

ackage with the health department to clear the open permit. Owner's agent 4 State review — roughly 30-day windows. Health department 5 Confirm the county permit status — reuse it, renew it, or file fresh. Owner's agent, county portal 6 Licensed plumber pulls the county permit. Plumbing contractor 7 Install the corrected equipment per the engineer's design. Plumbing contractor 8 County final inspection. County inspector 9 State issues the operating permit — the pool legally reopens. Health department · FINAL GATE Green = the critical chain — these five control the fi"}, "EYG5DjumXpoPCwwPcH4gDW": {"n": "02", "ok": true, "t": "Print Email link Copy link Expand all Collapse all Orange Tree Every job folder you have — grouped by the numbering scheme it actually uses. Click any name to open it in Drive. G:\\My Drive\\01-JOBS — ONE SOURCE OF TRUTH · counted 2026-08-17 38 FOLDERS 35 REAL JOBS 2,194 DOCUMENTS 8 NUMBERING SCHEMES 1 VERSION LOGS 4 HAVE A PORTAL One number to distrust. The desktop panel says “35 touched this week” — all of them. That is almost certainly the folder rename plus Sync-Jobs-To-Drive touching every folder at once, not client activity. Count documents added, not folders touched. TRK-2026 — CANONICAL 19 the format the charter specifies TRK-2026-1256 — Groves at Sunset Karla 159 files 20001 SW 110 CT Unit 143 TRK-2026-1262 · address-first name 94 files version log TRK-2026-1265 — Bal Harbour Permit Status MZ Solutions — TRK-2026-1268 — 1500 Ocean Drive Miami Beach · roof permit DD — 14953 SW 34 ST TRK-2026-1280 · address-first name 1 file TRK-2026-1286 — 11997 SW 218 St Alec Valdes · Avis Builders · folio 30-6912-004-0951 — name fixed 8/17 TRK-2026-1289 — folio 01-4102-098-0001 Alec Valdes · City of Miami — folio is not a property TRK-2026-1292 — 7823 NW 5th Ave Alec Valdes · Avis Builders · folio 01-3112-016-0030 — 1531 is the same parcel TRK-2026-1293 — MZ Solutions LLC company credentials 2026 — TRK-2026-1294 — Edison Towers II 661 NW 58 St · TEDC — you still want it running: paste one short PowerShell block yourself (below) — I can't register it for you. Needs you, one time 5 Grok/ChatGPT/Gemini wrapper scripts, if you want them reading this folder too — not built yet. Ask if you want it OWNER PARTICIPATION Only at step 4, and only if you decide to keep the recurring version despite the privacy trade-off. Nothing else in this needs you — the one-shot \"mirror now\" version is already working with zero clicks from you. CONFIRMED: PASTE, NOT CLICK WHY THIS ONE CAN'T BE A BUTTON I can build a button that runs anything I'm allowed to run — but the recurring screen-capture task itself was specifically refused by the safety layer, for both of us. That's not a permission I can hand off to a button; it's you personally accepting the risk. Paste this into PowerShell yourself, only if you still want it: Register-ScheduledTask -TaskName \"CU"}, "BzjdAZwNWxjnamxXeoMuXr": {"n": "08", "ok": true, "t": "🧭 Which Window Am I? 🧾 My AI Subscriptions 📧 10980 SW 202 Dr Email Tracker (here) 10980 SW 202 Dr, Unit 29 (Cutlerwood Apartments) — Email Tracker Every email touching this job, oldest to newest. Master tracking number TRK-2026-1667 (folds in prior filing TRK-2026-1310). Built from your connected Outlook mailbox, 2026-09-14. WHO'S IN THE EMAIL CIRCLE Jorge Valdes Jorge@TeamUsaSales.com Owner's Agent / Plans Expeditor — Team USA Sales, Inc. Cinde Velazquez cvelazquez@asdenproperties.com Property Manager, Cutlerwood Apartments / Asden Properties — the signer contact Nate Follman nfollman@asdenproperties.com Asden Properties Alexis Lamela alexis@paramounthomesnj.com Paramount Homes NJ — corporate/ownership contact, name-change on signer Miguel Zaldivar miguel@mzsolutions.org Contractor — MZ Solutions, LLC, CGC1528486 Miguel Zaldivar mzaldivar@tedcbuilds.org Same person, TEDc hat — VP Construction & Facilities Miguel Zaldivar mzaldivar051@gmail.com Same person, personal forward of engineer's plans Patricia Fiallo pfiallo@plfengineers.com PLF Structural Engineers — signed/sealed structural drawings (office) Admin@plfengineers.com PLF Structural Engineers, general box Javier De La Rocha javier@ecssurveyors.com Surveyor — property survey Miami-Dade PA cpl@MiamiDadePA.gov Auto-reply — building jacket request Email log — oldest → newest DATE / TIME FROM → TO SUBJECT ATTACHMENTS Jul 1, 2026 12:36 PM M. Zaldivar (gmail) → Jorge Fwd: 10980 SW 202 Dr Cutler Bay_ Concrete restoration Structural plans View Jul 5–6, 2026 4:00 PM – 9:22 AM Jorge (never sent) 6 DRAFT iterations of the permit packet to Miguel — Outlook confirms isDraft:true on every one. Jorge's own 7/7 email says it directly: \"the emails below were part [of a] thread but I opted to not include them pending your review.\" These never reached Miguel's inbox — kept here only so the draft history isn't lost. drafted, not delivered Jul 7, 2026 12:20 PM Jorge → M. Zaldivar, cc P. Fiallo, frank@plfengineers.com First actual send — 10980 SW 202 Dr — Legalization permit docs for signature (red X = owner signs) — TRK-2026-1310 Permit AppNOCTermination NOCRelease of LienCorp. ResolutionBlank Ext-of-TimeStructural Plans View Jul 7, 2026 12:39 PM P. Fiallo (PLF Eng.) → Jorge RE: 10980 SW 202 Dr — Legalization permit docs for signature — TRK-2026-1310 Reply w/ attachment View Aug 24, 2026 4:01 PM Miami-Dade PA → Jorge bldg jacket for 10980 SW 202 DR Building jacket View Aug 28, 2026 10:56 AM M. Zaldivar (TEDc) → Cinde,"}, "FheBLDwMmA8mkMLw1k6A1n": {"n": "09", "ok": true, "t": "Executive Orchestrator Overnight automation blueprint for your LLM consolidation The Role Mesh Flow graph TB YOU[\"🧑 You (Make one decision)\"] INTENT[\"00_INTENT.md (What you asked)\"] ORK[\"🎯 Executive Orchestrator (Reads everything, routes to roles)\"] PLAN[\"01_PLAN.md (Steps & owners)\"] PLANNER[\"📋 Planner (Claude Haiku)\"] LOG[\"02_WORKLOG.md (What ran)\"] IMPL[\"⚙️ Implementer (Claude Code)\"] PROOF[\"03_PROOF.md (Screenshots/hashes)\"] REV[\"🔍 Reviewer (Claude Sonnet)\"] HANDOFF[\"04_HANDOFF.md (Next role, blockers)\"] RELOC[\"🧭 Relocator (Policy only)\"] ARCH[\"🗂️ Archivist (Drive ↔ OneDrive)\"] DRIVE[\"☁️ Google Drive (Single source of truth)\"] YOU -->|dictate once| INTENT INTENT -->|routes to| ORK ORK -->|assigns| PLAN PLAN -->|goes to| PLANNER PLANNER -->|writes to Drive| DRIVE PLAN -->|goes to| IMPL IMPL -->|executes & logs| LOG LOG -->|goes to| PROOF PROOF -->|goes to| REV REV -->|writes| HANDOFF HANDOFF -->|routes next| RELOC HANDOFF -->|sync tasks to| ARCH RELOC -->|decides model| IMPL ARCH -->|backs up to OneDrive| DRIVE Low-Tech Narrative You are the Executive Orchestrator. You dictate one request into Google Drive (your 00_INTENT.md file). You don't execute anything, don't click anything, don't move things around. You just say what you want. Claude Code reads your request and makes ALL the decisions. It doesn't ask you for clarification. It reads the intent, looks at what you have (Drive folders, passwords, emails), figures out the smartest way to do it, and then executes everything in one batch. Along the way, it writes a worklog (what it did), proof (screenshots and file hashes), and a handoff file saying what's done and what needs human judgment. Each role has one job and talks only through files. Planner drafts the steps. Implementer (Claude Code) runs them. Reviewer checks the work. Relocator is just a policy table that says \"use cheap models for routine work, expensive models for hard decisions.\" Archivist keeps Drive and OneDrive in sync. They never fight over who does what because the handoff file is always the source of truth. Google Drive is your control center. Everything lives there: the queue of tasks (00_INTENT files), the execution logs (02_WORKLOG), the proof (03_PROOF), and the next steps (04_HANDOFF). You never log into three different apps. You never hunt for where something is. You open Drive once a day, see what finished, read the proof, and decide the next thing. The computer stays on overnight and executes while you sleep. You leave"}, "TDpqEz7ydHGchc8ZaxVGs8": {"n": "10", "ok": false, "t": ""}, "KPXyksinWSAEhDiBkS2ttA": {"n": "11", "ok": true, "t": "Expand all Collapse to root Show gaps only Contiguous — all properties View selected Copy selection for email Print Copy link Orange Tree — Due Diligence Three layers: property → folder → document or source. Tick boxes to choose what you share. Each property has its own Read end to end button — the whole file as one continuous page. Nothing is blank — every slot we could not reach says who was blocked and what opens it. TRK-2026-9344 · v2 · 2026-08-18 · 7 properties · sources + documents · statuses measured, not assumed Answered Blocked Needs you Not applicable Document on disk About the original Orange Tree, honestly. The single three-layer report you built has not been found as one file — what survives are its pieces: the eight unit capsules, the per-unit index, and the client documents. This page is the rebuild, and from today it lives in Google Drive as the source of truth with a OneDrive backup — so it cannot go missing the same way twice. A finder card in Drive answers any search for \"orange tree.\" \"No permits found\" and \"we were refused\" look identical in every report ever written here. That is why every slot carries a reason, and why a blank cell no longer exists. New — one PDF, the 5 sample properties, scroll straight through. 20 pages, each property's identity fields, images and core Property Appraiser record, back to back, with a bookmark per property in the PDF's own outline panel. This is a condensed excerpt (identity + core PA record only) — the full 22-source finding for each property stays at its own live link above. Tamiami Canal Rd and the Bal Harbour/Plaza 8-unit set aren't in this one: Tamiami's capsule is a 50-document folder, and Plaza already has its own combined PDF, the Orange Tree Capsules page. Open combined PDF — 5 properties → ▾ 331 Tamiami Canal Rd, Miami TRK-2026-1612 · 0 ules, model default\"] PC --> J[\"J · OneDrive\\Scripts watcher, reconciler, registrar, OCR, ProofOfDone\"] PC --> K[\"K · C:\\AI state\\job-executor logs, scripts\\Inbox-Job-Watcher.ps1\"] PC --> L[\"L · CU-FILING-SYSTEM\\00_SYSTEM _WORK-REGISTER.csv register of record\"] PC --> N[\"N · Desktop\\_FILED 01-Boards-HTA · 05-Scripts one-click .cmd\"] PC --> O[\"O · Legacy: OneDrive\\Desktop\\VerticalTray_1-5, Dropbox\\MasterAgent, ClaudeBridge, C:\\Tools, LLM-Control-Panel\"] PC --> P[\"P · D:\\Dropbox-Migration-2026-0"}, "G3vNM7DXLtMKcLqUXv5B8k": {"n": "26", "ok": true, "t": "TEAM USA SALES, INC. · CU INSPECTIONS OF SOUTH FLORIDA Systems Handoff Brief Prepared for the incoming IT / programmer · September 12, 2026 · Owner: Jorge Valdes This is the whole story in one read: what the business does, what has been built to run it, what is actually running versus what only exists on paper, where every piece lives, and where the owner wants it to go. It is written to be read straight through or listened to with a screen reader. Nothing here is hidden behind a table; the diagrams repeat what the text already says. Index 1. The business and the owner · 2. The problem you were hired to solve · 3. The machine and the accounts · 4. The agent lanes and their names · 5. The bridge: how work moves · 6. Inventory: live, partial, never built, dead · 7. The code that exists · 8. The data and the backlog · 9. The standing rules · 10. Business projects in flight · 11. Where the owner wants to go · 12. Suggested first thirty days · 13. Known contradictions to verify · 14. Pending tasks, numbered by status · 15. Scope of work for the IT / programmer · 16. Owner directive: the 3-run rule is waived through 2026 · 17. Owner's manual: files, folders, languages, tools, status · 18. Data knowledge required, by function · 19. Proficiency ratings for the hire · 20. First-meeting agenda · 21. Matrix: LLMs, tools, programs, abilities, communication and redundancy 1. The business and the owner Jorge Valdes owns two companies in Miami. Team USA Sales, Inc. does permit expediting, plans processing, and real-estate due diligence. CU Inspections of South Florida is the inspection-side company. He works as the property owner's authorized agent, plans expeditor, and attorney-in-fact, coordinating contractors, architects, engineers, and government agencies to legalize unpermitted work and clear code-enforcement cases across Miami-Dade and Broward County. Roughly thirty-five municipalities are served, running on about four different permit software platforms. He is a former mortgage banker and has been a business owner all his life. He is not a programmer, though the setup he has accumulated is developer-grade. The service he is building toward is a forensic permit and code-enforcement risk report, now named RDF Reports, Research and Disclosure of Findings Reports. The pitch is that Miami-Dade enforcement has modernized with aerial imagery and body cameras, so unpermitted work gets caught more every year, and a buyer of an existing home needs a report that assumes noth"}, "RT6xhftjzdEjDPptfzqWwC": {"n": "27", "ok": true, "t": "VTES Command snapshot · 2026-09-12 · Miami One screen for the three Claude seats, what needs you, and your jobs. Not a live feed — a current snapshot the cloud seat refreshes. If a number looks wrong, the source file is wrong, not this page. THE SEATS ☁️ Cloud · Web Gmail · Drive · Outlook · repo · planning. No hands on the PC. 🖥️ Desktop · RAMBO Heartbeat live, every 3 min. Files · 1Password · portals · the browser navigator. 🧠 Grok · xAI Key found, second-opinion bus wired. A brain on call, not an executor. The navigator that clicks for you is RAMBO driving Chrome. It works when the Chrome control extension is connected — when it drops, that's the CONNECT CHROME button on your desktop. Full mouse-anywhere control isn't live yet; browser-driving is. NEEDS YOU — ONE CLICK EACH $44 City of Miami microfilm — deadline passed 09-05 Txn 1330901. Verify cuments behind each entry. Prepared for Jorge Valdes · Companion to the Affordable Housing Finance Primer First, the honest framing Hedge funds in the classic sense, meaning trading vehicles that go long and short and charge two-and-twenty, are almost absent from this space, and the reason is structural. The main product being sold is a federal tax credit, and a tax credit is only worth something to an investor with a large, predictable, taxable income to shelter. Hedge funds are pass-through partnerships whose taxable income swings year to year, so they cannot use the credit. The institutions that can are banks, insurance companies, and large corporations, and they buy through specialist syndicators. The money that behaves like private equity in affordable housing comes from a second group: real estate asset managers and impact funds, financed by pension funds, insurers, foundations, and family offices, that buy and preserve existing affordable buildings for cash flow and appreciation rather than for credits. The largest of those is Blackstone, which is as close to a hedge-fund name as this market gets. The Federal Reserve Bank of New York surveyed twenty-two of these private managers in early 2025. Together they had raised eighteen point four billion dollars over the prior five years. Pension funds and banks each supplied about a quarter of that capital, with insurers, high-net-worth individuals, and endowments making up the rest. Florida was one of the five states most often named as a target market. Ninety percent of the capital financed units for households under eighty percent of area median income, and the managers said they planned to raise the share going to new construction from seven percent to twenty-four percent of future commitments, which is exactly the kind of deal a developer like TEDc brings. flowchart TB subgraph SRC[\"Where the money originates\"] PEN[\"Pension funds ~25%\"] BNK[\"Banks ~25% also motivated by Community Reinvestment Act credit\"] INS[\"Insurers, endowments, family offices, high net worth\"] end subgraph VEH[\"The vehicles\"] SYN[\"LIHTC syndicator funds buy the tax credits 4.35% to 10.25% after-tax IRR\"] PE[\"Real estate and impact funds buy"}, "NXsxjbmTyTSppxU8C9Fd68": {"n": "29", "ok": true, "t": "Affordable Housing Finance Primer VTES Control Panel TEAM USA SALES, INC. · ORIENTATION BRIEFING · SEPTEMBER 2026 How Affordable Housing Deals Actually Get Financed A plain-language walk through the money behind a nonprofit developer's projects: the tax credits, the state and county layers, why some awards are automatic and some are a lottery, why the application package is a legal document, and what to make of an equity offering that promises nineteen percent. Prepared for Jorge Valdes · Reading edition, built for listening straight through Part one. The one idea everything hangs on You spent years as a mortgage banker, so start there. A conventional apartment building is financed with a first mortgage and the owner's equity. The rents pay the mortgage. Affordable housing breaks that arithmetic on purpose: the rents are capped at what a family earning sixty percent or less of the area median income can pay, so the rents can only carry a small mortgage. Something has to fill the gap between what the building costs and what the rents can support. That gap filler is the whole industry. The biggest piece is a federal income tax credit that the developer does not use itself. The developer sells the right to those credits to a corporation, almost always a bank, which pays cash up front in exchange for ten years of tax reductions. That cash is the equity. Below the credits sit soft loans from the state and county, meaning loans at zero or one percent interest with payments deferred until the building has cash flow, and sometimes never repaid. Then a small first mortgage on top. Then the developer defers part of its own fee. Stack those layers and the building pencils. MORTGAGE BANKER'S TRANSLATION Think of a tax credit deal as a purchase where the buyer's down payment is manufactured by the tax code and sold to a bank for cash, the seller financing comes from government at near-zero interest, and the bank loan is sized to the capped rents rather than the market rents. flowchart TB IRS[\"Federal government Internal Revenue Service authorizes tax credits by statute\"] --> FHFC[\"State agency Florida Housing Finance Corporation allocates credits, SAIL loans, bonds\"] FHFC --> DEV[\"Developer Tacolcy Economic Development Corp\"] CTY[\"County Miami-Dade Housing and Community Development Surtax, SHIP, HOME gap loans\"] --> DEV DEV -->|\"sells 10 years of credits\"| INV[\"Equity investor usually a bank buying credits through a syndicator fund\"] INV -->|\"cash equity\"| PROJ[\"The bu"}, "8hiNCM3ibEmaQbSvkqgjEp": {"n": "30", "ok": true, "t": "TEAM USA SALES, INC. · CU INSPECTIONS OF SOUTH FLORIDA PREPARED 2026-09-03 · VERSION 1 · CURRENT Alec Valdes Coverage Ledger Which of the 22 Miami‑Dade and Florida records sources were run, how much each returned, and how much of that reached the five dossiers written for the client. 22 Sources in the registry 20 Proven end‑to‑end 153 Record blocks retrieved 5 Dossiers written 23% Of possible source coverage reached the books THE 22 SOURCES Retrieved (NN) counts the discrete record blocks — a quoted JSON response, a permit table, a case list, a licence record — captured in that source’s proof file on 2026‑08‑15/16. County records are returned as data, not as printed pages, so a page count would be invented; this is the honest unit. In books counts how many of the five dossiers actually carry that source. SITE SOURCE STATUS RETRIEVED PARCELS IN BOOKS 01 Property Appraiser — property search PROVEN 8 7 5 / 5 02 Property Appraiser — comparable sales PROVEN 6 21 2 / 5 03 Tax Collector — real estate tax PROVEN 4 4 1 / 5 04 Clerk of Courts — Official Records PARTIAL 7 — 5 / 5 05 Clerk of Courts — civil case search PROVEN 6 — 0 / 5 06 Building Permit Selection Menu PROVEN 8 2 5 / 5 07 EPS e‑permitting portal PROVEN 7 3 0 / 5 08 Building Support Case Search PROVEN 5 8 0 / 5 09 Code Enforcement Online System PROVEN 9 5 0 / 5 10 Neighborhood Code Case Search PROVEN 11 12 0 / 5 11 Unsafe Structures search PROVEN 7 11 1 / 5 12 Certificates of Use search PARTIAL 6 8 0 / 5 13 DERM Environmental Code Enforcement PROVEN 10 20 1 / 5 14 DERM environmental public records PROVEN 6 5 0 / 5 15 Building products / NOA search PROVEN 7 — 0 / 5 16 Zoning / land use lookup PROVEN 9 7 1 / 5 17 City of Miami permits PROVEN 11 4 3 / 5 18 Miami Beach permits PROVEN 8 — 0 / 5 19 Florida Sunbiz entity search PROVEN 5 — 1 / 5 20 DBPR licensee search PROVEN 3 — 0 / 5 21 Florida Product Approval PROVEN 1 — 0 / 5 22 Pembroke Pines / Broward permits PROVEN 9 — 0 / 5 THE FIVE DOSSIERS Each book was written 2026‑08‑30 with a cover, index, executive summary, verdict and risk rating. All five are presentable. None has been sent. 331 Tamiami Canal Rd TRK-2026-1612 · 8 pp 9 / 22 sources present Low‑to‑moderate. FEMA flood‑zone conflict; possible unpermitted additions. City of Miami master folio TRK-2026-1289 · 7 pp 5 / 22 sources present Not assessable. A reference folio carries no owner, permit or case. 7823 NW 5 Ave TRK-2026-1292 / 1531 · 7 pp 4 / 22 sources present Moderate‑to‑high. Vacant‑coded p"}, "MkCVV256GCTNHZ3R4Xkk8i": {"n": "31", "ok": true, "t": "TEDC Hybrid Program A proposed build plan: seven modules, five stages, and where each one runs. Nothing here is built yet. CLIENT TEDC PREPARED 2026-08-31 STATUS PROPOSAL JOBS COVERED 3 READ THIS FIRST I could not find an existing \"TEDC Hybrid\" specification. Not on this PC, not in Google Drive, not in your Gmail. So this is not a recovered document — it is a plan I wrote from what is actually on your machine today. What it is built from: your three TEDC job capsules and their real document counts, the Orange Tree portal builder you already use, and your own earlier decision that a portal should be a window onto your HQ folders, not a second filing cabinet. If you have an original spec in another Claude window, send it and I will replace this. WHAT \"HYBRID\" MEANS HERE Two halves that most systems make you choose between. The truth stays local — your Google Drive job capsules remain the single source, exactly as they are now, with no migration and no second copy to drift. The view goes online — Miguel Zaldivar and Sheldon Powell open a web page and see only their own jobs, their own draws, and their own reports. You keep working in folders. They stop emailing you for status. That is the whole idea. THE SEVEN MODULES M1 Capsule Bridge Reads your three TEDC capsules and turns each into structured data — job, folio, tracking number, stage, documents, dollars. Read-only. It never writes into a capsule, so it can never damage your filing. INTEGRATESGoogle Drive capsules under 01-JOBS — ONE SOURCE OF TRUTH; the existing _STAGE.md files; MASTER TRK numbering. M2 Document Vault Makes every TEDC document findable. This is the module that pays for itself: 658 TEDC documents currently sit in no capsule at all, 168 Garden Walk PDFs have never been text-recognised, and 24 signed Sugar Hill recertification reports are locked inside ZIP files that read as blank to any search. INTEGRATESYour existing OCR queue and .SEARCH.txt sidecars; the document-intake naming and hashtag standard. M3 Draw & Contract Tracker The money spine. Garden Walk is a ten-draw contract and draw 4 alone was $5,700 back in 2018 — it has never appeared on any invoice list. Sugar Hill carries $47,780. This module holds each contract, each draw, what was billed, what was paid, and what is still owed. INTEGRATESQuickBooks Online for invoice and payment status; your invoice templates. M4 Report Delivery Publishes finished recertification and inspection reports to the client with a delivery receipt, so \"d"}, "JNFQ4n52BbELxSXSKDBH8C": {"n": "32", "ok": true, "t": "PROPERTY DUE-DILIGENCE · PUBLIC RECORDS SCRAPE County Records Scrape — completion report 22 public sources · one section per site · TRK-2026-9007 / results TRK-2026-9078 91% fully complete — 20 of 22 sources captured with proof 20 CAPTURED 2 PARTIAL 0 SILENTLY DROPPED The headline: the earlier July attempt returned only 3–4 of 20 and announced nothing. This run — one agent per site — closed all 22, with 20 fully captured and 2 partial. Nothing was left without a status. The 2 that are only partial are not “missed” — they are gated. One sits behind a human anti-robot check; the other's modern search was retired by the county. Neither can be scraped by any automation; both close only with a human step. Details in their sections and at the end. Your list has 22 sources, not 25–30. If you're picturing more, tell me which and I'll add them. Sources #17–22 already reach beyond Miami-Dade into your City-of-Miami, Miami Beach and Broward jobs. CORE COUNTY PROPERTY & RECORDS 01 Property Appraiser — property search CAPTURED INTENDED INFORMATION Folio, owner, legal description, building characteristics, assessed values. RESULT The spine — folio drives almost every other lookup. The endpoint had quietly moved: the old host returned HTTP 200 with an error page (looked retired, wasn't). Corrected to the live proxy and captured cleanly. Access Anonymous GET — no browser needed Endpoint apps.miamidadepa.gov/PApublicServiceProxy 02 Property Appraiser — comparable sales CAPTURED INTENDED INFORMATION Sales history and comparable sales. RESULT Sales chain retrieved through the same Property Appraiser proxy (the SalesInfos block on the folio call). Access Anonymous GET Note Same call as #01, nested payload 03 Tax Collector — real-estate tax CAPTURED INTENDED INFORMATION Tax bills, payment status, delinquency. RESULT Bill and delinquency status retrieved. This one needed a real browser session — one of only three that did. Access Chrome required (desktop) Note Not reachable from cloud 04 Clerk of Courts — Official Records PARTIAL — GATED INTENDED INFORMATION Deeds, mortgages, liens, satisfactions — the highest-value source after the Property Appraiser. WHY PARTIAL The search stops at a Cloudflare “prove you're human” check (Turnstile captcha). That was correctly not worked around — defeating an anti-robot control is out of bounds. How it closes A person passes the captcha once, or a public-records request Automatable? No — for any tool 05 Clerk of Courts — civil case search CAP"}, "WWG4A2skBXNAEmNmNu4TmU": {"n": "33", "ok": true, "t": "CONTIGUOUS JACKET · GAPS & PLACEHOLDERS Where the 10980 jacket is still incomplete TRK-2026-1310 · Cabana Club Gardens Apts · 10980 SW 202 DR · built 1966 The good news first: the whole jacket is transcribed — 22 original pages, every card, photo and permit slip read and typed out. The 1989 permit 89037613 (add-alt, alter exterior, roof) is on file and SAFE. Four things are still open. Only one is a truly missing document; two are handwriting I can't read with certainty from the cloud; one is page rotation I set by eye instead of by machine. Each has a plan, and each has a comment box for you. Write in any box below. Your notes save on this device automatically. When you're done, tap “Copy all my comments” at the bottom and paste them back to me. MISSING — NO ACCESS ILLEGIBLE — DEGRADED NOT BUILT YET ON FILE — SAFE G-1 The permit for the CBS perimeter wall is not in the jacket MISSING — NO ACCESS WHAT'S MISSING The Property Appraiser cards record a CBS WALL added around 1970 (“add CB Wall,” yr-70 line) and carry it as an extra feature worth points. But every PERMIT box on those cards is blank. From the jacket alone, that wall reads as an unpermitted change → legalization exposure. WHY I CAN'T CLOSE IT FROM HERE If a 1970 building permit exists, it lives in Miami-Dade Building Department microfilm, which I cannot reach from the cloud. The PA jacket and the Building Department are two different offices — the PA card never proves a permit either way. How I'll overcome it The microfilm-retrieval errand is already queued (due before 2026-09-05). It pulls the 1970 permit record for this folio. If found → the wall becomes SAFE. If none exists → we document it as a known legalization item so the buyer isn't blindsided. The 1989 permit already on file is unaffected. YOUR COMMENT ON G-1 G-2 Signatures and initials on the photo backs can't be read for sure ILLEGIBLE — DEGRADED WHAT'S UNREADABLE The cursive initials on the backs of the 1967 Polaroids (pages 2, 4, 6) and the sign-off initials on the 1989 permit card — I read them as J.Steph? and A.Ryers?, but the question marks are honest. The folio (30-6007-009-0030) and the date (11-20-67) on those backs are clear. WHY IT'S HARD FROM HERE These are copier scans of 58-year-old handwriting. Cloud rendering can darken them, but can't invent detail that the copy already lost. How I'll overcome it Desktop re-scans the original Polaroid backs at high resolution and runs OCR on them. If they're still unreadable, I mark them"}, "RcYAHKbGaVnZqRaQY96gSJ": {"n": "34", "ok": true, "t": "CU INSPECTIONS TAX-JACKET FIELD COMPANION FORENSIC DD BUILD-YEAR RED FLAGS Read the property's build year and any addition years off the tax jacket, then run this list. Each window tells the inspector one thing to check on site. Every item carries its confidence tag from the verified reference — nothing here is invented. RULE FIRST Untouched, permitted, code-at-the-time work stays grandfathered. The moment work is altered or legalized, grandfathering is lost — the after-the-fact permit is judged against current code (or the code when the work was done), at the building official's discretion, usually with a higher fee. So an addition year matters as much as the build year. CONFIRMED solid year — cite it. APPROX treat the year as a window, not a line. UNVERIFIED do not cite without a primary source. A AT A GLANCE Where the era-triggered hazards fall on the calendar. Bars overlap — a single house can sit in several at once. Scroll sideways to read the full span. '20 '30 '40 '50 '60 '70 '80 '90 '00 '10 '20 '26 LEAD PAINT pre-1978 ASBESTOS MATERIALS pre-1980 GALVANIZED SUPPLY ~1930–mid-70s CAST-IRON DRAIN · SOFLA pre-1975 FPE STAB-LOK PANEL 1950–1990 ALUMINUM BRANCH WIRING 1965–73 ZINSCO PANEL 1963–81 CENTRAL DUCT A/C · SOFLA 1960s → now POLYBUTYLENE PIPE 1978–95 CHINESE DRYWALL · FL 2001–09 Not on the calendar — condition-triggered at any build year: FEMA below-BFE enclosure · bathroom fixture clearance. See the list below. B THE CHECKLIST One row per threshold. Lead with the bolded action; the source note is the why. Pre-1978 LEAD-BASED PAINT If built before 1978 → presume lead paint; trigger federal disclosure. CONFIRMED the cleanest threshold in the reference. Federal residential lead-paint ban, 1978. ~75% of pre-1978 homes still contain some lead; the rule never required removal, only disclosure on sale or lease. Pre-~1980 ASBESTOS MATERIALS If built or renovated before ~1980 → presume asbestos until tested — floor tile, mastic, popcorn ceiling, pipe wrap, siding, joint compound. CONFIRMED a window, not a ban year. Heavy residential use ~1920–1980. There was never a clean cutoff — say \"presume before ~1980,\" never a single ban year. 1978–1995 POLYBUTYLENE PIPE If built 1978–1995 → look for gray (sometimes blue or black) plastic supply pipe. Often uninsurable or a forced re-pipe. CONFIRMED say \"discontinued / removed from code after 1995,\" not \"banned.\" Chlorine in city water degrades poly-B from the inside; fittings crack and burst. Replaced by CPVC and PE"}, "GsvYocdkd3VyvSJK2L6eVY": {"n": "35", "ok": true, "t": "THE ONE THING AN AI CANNOT DO FOR YOU 4 pastes, ~2 minutes, and every AI wakes up knowing the protocol. One block goes into each app's custom-instructions box. After that, every window says who it is, checks #sitdown, and knows its lane before it answers. Do one card at a time. Open the app, find the box, paste, save. The same block is  record, and who else is playing in South Florida. Built 2026-08-20. 1. The vocabulary — 24 terms that unlock every conversation TERM PLAIN ENGLISH LIHTC Low-Income Housing Tax Credit. The engine of 90% of US affordable housing. The IRS gives a developer tax credits; the developer sells them to a bank for cash to build with. 9% credit The big credit — covers ~70% of building cost. Scarce; won by competition once a year. 4% credit The smaller credit — ~30% of cost. Not competitive; comes automatically with tax-exempt bonds. QAP Qualified Allocation Plan. Each state's rulebook for who wins the 9% credits. In Florida, Florida Housing writes it and runs the contest (RFAs). RFA Request for Applications — Florida Housing's funding contests. You apply per deal. AMI Area Median Income. Every rent limit is a % of it: \"60% AMI unit\" = rent capped for a family earning 60% of the county median. Syndicator The middleman who bundles bank money into funds and buys developers' tax credits (Raymond James, NEF, Enterprise, Boston Financial…). GP / LP General Partner (the developer — runs the deal, tiny ownership ~0.01%) / Limited Partner (the investor — ~99.99% ownership, gets the credits). Credit pricing What investors pay per $1.00 of credit — historically ~$0.85–$0.95. Higher price = more free equity for the deal. Developer fee The developer's paycheck, baked into the budget — Florida caps it around 16% of development cost. On a $30M deal that's ~$4–5M, usually partly deferred. TDC Total Development Cost — land + construction + soft costs + reserves + fee. Eligible basis The share of TDC the credits are calculated on (land never counts). QCT / DDA Qualified Census Tract / Difficult Development Area — locations that earn a 30% credit boost. Much of Liberty City qualifies. Soft debt Government loans that behave like grants — 0–3% interest, payment only if cash flow allows (Surtax, SAIL, SHIP, HOME). Hard debt The regular bank mortgage that must be paid every month. Tranche / mezzanine Layers of debt stacked by priority. First mortgage gets paid first; mezzanine sits behind it at a higher rate. DSCR Debt Service Coverage Ratio — rent income ÷ loan payment. Lenders want ~1.15+. Pro forma The deal's spreadsheet — projected costs, rents, expenses, loan sizing. HAP / Section 8 Housing Assistance Payment contract — HUD pays the rent gap for the tenant. Rent "}, "25QoqLk9JuFmGB7sGWFgq1": {"n": "48", "ok": true, "t": "1PASSWORD MIGRATION AUDIT THURSDAY, AUGUST 20, 2026 · 4:05 PM MIAMI You have been logging in from the wrong Chrome profile. 1Password is not broken, not switched off, and not empty. It holds 360 items covering 291 sites. It simply has no way to reach the Chrome window you actually browse in. Chrome is running four separate profiles. The one you use is named Work. It has no 1Password button installed and zero saved logins of its own. Every one of your 365 Chrome-saved logins, and the 1Password button, live in a different profile named Jorge that you are not browsing in. That is the whole reason nothing ever pops up when a sign-in box appears. CHROME PROFILE 1PASSWORD BUTTON ITS OWN SAVED LOGINS STATUS Work not installed 0 this is where you browse Jorge installed & enabled 365 where everything actually is Your Chrome installed & enabled 1 barely used Vivian not installed 0 leave alone Correction to the earlier report: the finding that \"the vault is empty\" was wrong. It came from a locked-vault read that returned nothing. The vault was read successfully at 3:47 PM today. WHAT THE COUNT ACTUALLY IS 360 ITEMS IN 1PASSWORD 320 of them logins, 291 sites 753 LOGINS STILL IN BROWSERS Chrome 389 · Edge 409 353 REDUNDANT COPIES same site, same username, stored twice 20 DUPLICATES INSIDE 1PASSWORD 13 sites carrying 2-6 copies each What is left to do 01 Put the 1Password button in the Work profile Chrome is already open on that store page in the Work profile. Press Add to Chrome, then Add extension. Google blocks any automation from pressing it. var CONN={},LIVE={state:'wait',note:'Asking the Claude Code Remote connector for the live session list…',at:null,sessions:[]};
function fmtT(iso){if(!iso)return 'unknown time';var d=new Date(iso);if(isNaN(d))return iso;try{return d.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' Miami'}catch(e){return iso.slice(0,16).replace('T',' ')+' UTC'}}
function sessUrl(s){return 'https://claude.ai/code/'+s.id}
function liveStatus(x){
if(x.live==='bridge'){var b=LIVE.sessions.filter(function(s){return s.environment_kind==='bridge'&&!/ARCHIVED/.test(s.session_status||'')});
if(!LIVE.at)return null;
if(!b.length)return {st:'off',t:'NEVER ESTABLISHED',d:'No PC session in the live list.',src:'live'};
b.sort(function(a,c){return (c.updated_at||'').localeCompare(a.updated_at||'')});var con=b.filter(function(s){return s.connection_status==='connected'})[0];
if(con)return {st:'live',t:'LIVE',d:'Session “'+(con.title||'Jorge-PC')+'” connected. Last activity '+fmtT(con.updated_at)+'.',src:'live',url:sessUrl(con),ul:'Open the live PC session'};
return {st:'down',t:'DOWN since '+fmtT(b[0].updated_at),d:'Newest PC session is disconnected. The PC may be asleep, or Remote Control stopped.',src:'live',url:sessUrl(b[0]),ul:'Open the last PC session'}}
if(x.live==='cloud'){if(!LIVE.at)return null;var c=LIVE.sessions.filter(function(s){return s.environment_kind==='anthropic_cloud'&&!/ARCHIVED/.test(s.session_status||'')});
var on=c.filter(function(s){return s.connection_status==='connected'||/RUNNING/.test(s.session_status||'')});
return on.length?{st:'live',t:'LIVE · '+on.length+' running',d:c.length+' open cloud sessions. Links to each are below.',src:'live'}:{st:'ref',t:'IDLE',d:'No cloud session running right now. Open one any time.',src:'live'}}
return null}
function rowStatus(x){var l=liveStatus(x);if(l)return l;var c=CONN[x.id];
if(c)return {st:LEGEND[c.state]?c.state:'off',t:c.label||c.state.toUpperCase(),d:(c.note||'')+' Recorded '+fmtT(c.as_of)+' by '+(c.by||'unknown')+'.',src:'record'};
if(x.live&&!LIVE.at&&LIVE.state==='wait')return {st:'wait',t:'CHECKING…',d:LIVE.note,src:'live'};
return {st:'off',t:'NO DATA',d:'No status has ever been recorded for this one.',src:'none'}}
function entCard(x){var s=rowStatus(x),url=s.url||x.url,ul=s.url?s.ul:x.ul;
var sub='';if(x.live==='cloud'&&LIVE.at){var c=LIVE.sessions.filter(function(q){return q.environment_kind==='anthropic_cloud'&&!/ARCHIVED/.test(q.session_status||'')}).slice(0,8);
sub=c.length?'<div class="sublist">'+c.map(function(q){var on=q.connection_status==='connected'||/RUNNING/.test(q.session_status||'');return '<a href="'+sessUrl(q)+'" target="_blank" rel="noopener"><span class="cstat mini" data-st="'+(on?'live':'ref')+'">'+(on?'LIVE':'idle')+'</span> '+esc(q.title||q.id)+' <small>'+fmtT(q.updated_at)+'</small></a>'}).join('')+'</div>':''}
return '<div class="card ent" id="ent-'+x.id+'"><div class="enthead"><h3>'+x.e+' '+esc(x.n)+'</h3><button class="cstat" data-st="'+s.st+'" onclick="VTES.toggle(\'why-'+x.id+'\')" title="Tap for details">● '+esc(s.t)+'</button></div>'+
'<p>'+esc(x.r)+'</p><div class="detail" id="why-'+x.id+'"><b>Status detail:</b> '+esc(s.d)+' <i>('+(s.src==='live'?'live from the Claude Code Remote connector':s.src==='record'?'last recorded status, not a live feed':'nothing recorded')+')</i></div>'+
'<div class="actions">'+(url?'<a class="act openbtn" href="'+url+'" target="_blank" rel="noopener">'+esc(ul||'Open')+' ↗</a>':'')+'</div>'+(x.how?'<p class="kv" style="margin-top:6px">'+esc(x.how)+'</p>':'')+sub+
'<details class="hand"><summary>Who it hands off to and receives from</summary><div class="lay"><b>1 · Hands work to</b><ul>'+x.to.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul><b>2 · Gets work from</b><ul>'+x.from.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul><b>3 · The road between them</b><p>'+esc(x.road)+'</p></div></details></div>'}
panes.CONNECT=function(){return '<p class="lead"><b>Every LLM, agent and bot, grouped by where it runs.</b> Each status button has one of the legend colors. Tap a status button to see where the status came from. Open buttons go straight to that chat.</p>'+legendHtml()+
'<div class="actions" style="margin:0 0 12px"><button class="act" onclick="VTES.recheck()">↻ Check live status now</button><span class="freshness" id="livestamp" style="align-self:center"></span></div><div id="connectbody"></div>'};
function drawConnect(){var el=document.getElementById('connectbody');if(!el)return;
el.innerHTML=GROUPS.map(function(g){return '<h4 class="grp">'+g[1]+'</h4><p class="lead" style="margin-bottom:8px">'+g[2]+'</p>'+ENT.filter(function(x){return x.g===g[0]}).map(entCard).join('')}).join('')+
'<p class="flagnote">Where do Grok bots go? <b>Grok chat</b> is an LLM you talk to, so it sits under Cloud. <b>Grok bots</b> have no chat window and run on a key, so they sit under Bots. The same rule applies to any other bot.</p>';
var ls=document.getElementById('livestamp');if(ls)ls.textContent=LIVE.at?('Live session list read '+fmtT(LIVE.at)+'.'):LIVE.note;legendAudit()}
function pickSessions(p){if(typeof p==='string'){var i=p.indexOf('{');if(i<0)return null;try{p=JSON.parse(p.slice(i))}catch(e){try{p=JSON.parse(p.slice(i,p.lastIndexOf('}')+1))}catch(e2){return null}}}
if(!p)return null;if(Array.isArray(p))return p;if(p.ccr&&Array.isArray(p.ccr.data))return p.ccr.data;if(Array.isArray(p.data))return p.data;if(Array.isArray(p.sessions))return p.sessions;return null}
var MCPS='Claude Code Remote',MCPT='list_sessions',MCPI={limit:50};
async function startLive(){var mcp=null;try{mcp=await claude.use('mcp')}catch(e){}
if(!mcp){LIVE.state='off';LIVE.note='Live check unavailable in this view (connector not allowed here). Showing last recorded status.';drawConnect();return}
window._mcp=mcp;
try{mcp.watchTool(MCPS,MCPT,MCPI,function(ev){if(ev.type==='data'){var r=ev.result||{},arr=pickSessions(r.payload!==undefined?r.payload:((r.content||[])[0]||{}).text);
if(arr){LIVE.sessions=arr;LIVE.state='live';LIVE.at=r.cache&&r.cache.storedAt?new Date(r.cache.storedAt).toISOString():new Date().toISOString();LIVE.note=''}else{LIVE.state='off';LIVE.note='Live list came back in a shape this page cannot read. Showing last recorded status.'}}
else{var c=ev.error&&ev.error.code;LIVE.at=c==='server_unavailable'||c==='upstream_error'?LIVE.at:null;if(!LIVE.at){LIVE.sessions=[];LIVE.state='off'}
LIVE.note=c==='needs_reauth'?'Reconnect Claude Code Remote in claude.ai Settings → Connectors.':c==='server_not_connected'?'Add Claude Code Remote in claude.ai Settings → Connectors.':c==='not_in_manifest'||c==='not_granted'?'You turned the live check off for this page. Showing last recorded status.':'Live check failed ('+(c||'error')+'). Showing last recorded status.'}
drawConnect()},{refetchInterval:120000})}catch(e){LIVE.state='off';LIVE.note='Live check could not start. Showing last recorded status.';drawConnect()}}
(async function(){var db=await getDb();if(!db){drawConnect();return}
try{db.collection('connections').onSnapshot(function(snap){CONN={};(snap.docs||[]).forEach(function(d){CONN[d.id]=(typeof d.data==='function'?d.data():d.data)||{}});drawConnect()},function(){drawConnect()})}catch(e){drawConnect()}})();
VTES.recheck=async function(){var m=window._mcp;if(!m){startLive();return}try{await m.invalidate(MCPS,MCPT,MCPI)}catch(e){}LIVE.state='wait';LIVE.note='Checking…';drawConnect()};

/* ===== TRACKER: every task the sweeper agent finds in the chats, with a fuel gauge per task. Data lives in db collection "tracker". ===== */
var TRK={},TRKFILTER='open';
var LANES=['Cloud Code','RAMBO (Desktop)','Cowork','Codex','Grok bot','Jorge'];
var URG={P0:'P0 · OWNER-FLAGGED ERROR, fix first',P1:'P1 · today',P2:'P2 · this week',P3:'P3 · when free'};
function hrs(ms){var h=ms/3600000;return h<1?Math.round(h*60)+' min':h<48?(Math.round(h*10)/10)+' h':Math.round(h/24)+' days'}
function tView(t){var now=Date.now(),s=Date.parse(t.build_start||t.created||''),d=Date.parse(t.build_due||''),pct=Math.max(0,Math.min(100,Number(t.pct)||0));
var exp=(isNaN(s)||isNaN(d)||d<=s)?null:Math.max(0,Math.min(100,Math.round((now-s)/(d-s)*100)));
var st=t.status||'queued',col;
if(st==='proposed'||(!t.schedule_approved&&st!=='done'&&st!=='rolled-out'))col='wait';else if(st==='blocked')col='down';else if(st==='done'||st==='rolled-out')col='live';else if(!isNaN(d)&&now>d&&pct<100)col='down';else if(exp!==null&&pct+10<exp)col='wait';else if(st==='queued')col='off';else col='live';
var rollout=Date.parse(t.rollout_due||'');if(isNaN(rollout)&&!isNaN(d))rollout=d+((Number(t.test_hours)||0)*3600000);
return {pct:pct,exp:exp,col:col,rollout:rollout,due:d,st:st}}
function gauge(t,v){return '<div class="gauge" data-st="'+v.col+'" title="Filled = work done. Notch = where it should be by now."><div class="fill" style="width:'+v.pct+'%"></div>'+(v.exp!==null?'<div class="notch" style="left:'+v.exp+'%"></div>':'')+'<span>'+v.pct+'%</span></div>'}
function tCard(id){var t=TRK[id],v=tView(t),now=Date.now();
var eta=isNaN(v.due)?'no build deadline set':(v.due>now?'build due in '+hrs(v.due-now)+' ('+fmtT(t.build_due)+')':'build was due '+fmtT(t.build_due)+' ('+hrs(now-v.due)+' late)');
var log=(t.log||[]).slice(-4).reverse().map(function(l){return '<li><b>'+esc(fmtT(l.at))+'</b> · '+esc(l.by||'')+': '+esc(l.text||'')+'</li>'}).join('');
return '<div class="card tk'+(t.owner_error?' p0':'')+'"><div class="enthead"><h3>'+(t.owner_error?'🚨 ':'')+esc(t.title||id)+'</h3><span class="cstat" data-st="'+v.col+'">● '+esc(v.st.toUpperCase())+'</span></div>'+
'<p class="kv">'+esc(URG[t.urgency]||t.urgency||'P2')+' · assigned to <b>'+esc(t.assignee||'not assigned')+'</b> · '+esc(id)+'</p>'+gauge(t,v)+
'<p class="kv" style="margin-top:6px">'+esc(eta)+' · then testing '+(Number(t.test_hours)||0)+' h · rollout '+(isNaN(v.rollout)?'not set':fmtT(new Date(v.rollout).toISOString()))+'</p>'+
(t.proof?'<p class="kv">Proof: '+esc(t.proof)+'</p>':'')+(t.source?'<p class="kv"><a href="'+esc(t.source)+'" target="_blank" rel="noopener" style="color:var(--accent)">Open the chat it came from ↗</a></p>':'')+
apprBox(id,t,v)+'<div class="actions">'+(t.owner_error?'':'<button class="act" style="border-color:var(--bad);color:var(--bad)" onclick="VTES.tflag(\''+id+'\')">🚨 This is an error: fix first</button>')+
'<select onchange="VTES.tassign(\''+id+'\',this.value)" style="font-size:13px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)"><option value="">Reassign to…</option>'+LANES.map(function(l){return '<option>'+l+'</option>'}).join('')+'</select>'+
'<button class="act details" onclick="VTES.toggle(\'tn-'+id+'\')">Add note</button></div>'+
'<div class="commentbox" id="tn-'+id+'"><textarea id="tnt-'+id+'" placeholder="Your note. The sweeper agent reads these."></textarea><div style="margin-top:6px"><button class="act" onclick="VTES.tnote(\''+id+'\')">Save note</button></div></div>'+
(log?'<details class="hand"><summary>Activity log</summary><ul class="lay">'+log+'</ul></details>':'')+'</div>'}
function toLocalInput(iso){var d=new Date(iso);if(isNaN(d))return '';var p=function(n){return ('0'+n).slice(-2)};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function apprBox(id,t,v){if(t.status==='done'||t.status==='rolled-out')return '';
if(t.schedule_approved)return '<p class="kv" style="color:var(--good)">✅ Schedule approved by you '+esc(fmtT(t.approved_at))+(t.schedule_changed?' (you changed it)':'')+'.</p>';
return '<div class="apprbox" data-st="wait"><b>⏳ Waiting on your OK for this schedule.</b> Done by '+esc(fmtT(t.build_due))+', then '+(Number(t.test_hours)||0)+' h of testing.'+
'<div class="actions"><button class="act approve" onclick="VTES.tapprove(\''+id+'\')">✅ Approve schedule</button><button class="act" onclick="VTES.toggle(\'ch-'+id+'\')">✏️ Change schedule</button></div>'+
'<div class="commentbox" id="ch-'+id+'"><label class="kv">Done by <input type="datetime-local" id="chd-'+id+'" value="'+toLocalInput(t.build_due)+'"></label><br><label class="kv">Testing hours <input type="number" min="0" step="1" id="cht-'+id+'" value="'+(Number(t.test_hours)||0)+'" style="width:70px"></label><div style="margin-top:6px"><button class="act approve" onclick="VTES.tchange(\''+id+'\')">Send my schedule to the orchestrator</button></div></div></div>'}
function tOrder(a,b){var A=TRK[a],B=TRK[b];if(!!B.owner_error!==!!A.owner_error)return B.owner_error?1:-1;var u=(A.urgency||'P2').localeCompare(B.urgency||'P2');if(u)return u;return (A.build_due||'9').localeCompare(B.build_due||'9')}
function drawTracker(){var el=document.getElementById('trackbody');if(!el)return;var ids=Object.keys(TRK);
var open=ids.filter(function(i){var s=TRK[i].status;return s!=='done'&&s!=='rolled-out'});

var done=ids.length-open.length,p0=open.filter(function(i){return TRK[i].owner_error}).length,wt=open.filter(function(i){return !TRK[i].schedule_approved}).length;

el.innerHTML=show.length?show.map(tCard).join(''):'<p class="notwired">'+(TRK_STATE==='nodb'?'The task list could not load in this view. Nothing is shown rather than old numbers.':'No tasks recorded yet.')+'</p>';legendAudit()}

panes.TRACKER=function(){return '<p class="lead"><b>Every task found in your chats, with who has it and when it will be working.</b> A sweeper agent reads the chats every 2 hours, adds tasks it finds with a proposed schedule, and updates the gauges. <b>Nothing is dispatched until you approve or change its schedule</b>, except errors you called out, which start at once. Each gauge fills to 100% as work gets done. The notch is where it should be by now. When the gauge is full, it goes to testing for the hours shown, then rollout.</p>'+
'<p class="flagnote"><b>Owner rule:</b> anything you call an error goes straight to the top as P0. It never goes to the back of the line. Tap 🚨 on any task, or say “that is an error” in any chat and the sweeper flags it.</p>'+legendHtml()+
'<div class="actions" style="margin:0 0 10px"><button class="act" onclick="VTES.tfilter2(\'open\')">Open tasks</button><button class="act" onclick="VTES.tfilter2(\'all\')">All, including done</button></div><p class="freshness" id="tracksum"></p><div id="trackbody"><p class="notwired">Loading tasks…</p></div>'};
