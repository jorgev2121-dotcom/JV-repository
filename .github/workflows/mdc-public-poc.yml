name: mdc-public-poc
on:
  push:
    branches: [claude/modest-brown-rqbnkp]
    paths: [tools/poc/**, .github/workflows/mdc-public-poc.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/poc/mdc_public_poc.py
      - uses: actions/upload-artifact@v4
        with:
          name: poc-result
          path: poc_result.json
