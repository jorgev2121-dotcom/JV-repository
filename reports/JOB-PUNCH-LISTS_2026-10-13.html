<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an index, then one sheet per job (or two small jobs per sheet), each split into "Claude does" and "You do". Orange Tree tokens. */
:root{--ground:#fbfaf8;--surface:#fff;--raised:#f4f1ec;--line:#e4dfd7;--ink:#16181d;--muted:#5d6470;--accent:#b4650c;--accent-soft:#f7ead9;--ok:#1a6f3c;--ok-soft:#e4f2e8;--owner:#1a5fb4;--owner-soft:#e6eef9;--money:#a32d1f;--money-soft:#fbe8e5;
--display:Archivo,"Segoe UI",sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#0a0c0f;--surface:#14171c;--raised:#1b1f26;--line:#282d36;--ink:#e7ecf1;--muted:#94a1b0;--accent:#ffb35c;--accent-soft:#2a1c0c;--ok:#6ede9b;--ok-soft:#0f2417;--owner:#7fbfff;--owner-soft:#111d2b;--money:#ff8b78;--money-soft:#2c1311;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0a0c0f;--surface:#14171c;--raised:#1b1f26;--line:#282d36;--ink:#e7ecf1;--muted:#94a1b0;--accent:#ffb35c;--accent-soft:#2a1c0c;--ok:#6ede9b;--ok-soft:#0f2417;--owner:#7fbfff;--owner-soft:#111d2b;--money:#ff8b78;--money-soft:#2c1311;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.45;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:18px;padding-block:0 60px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:7px;padding:9px 18px;align-items:center}
button{font-family:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:7px;background:var(--raised);color:var(--ink);padding:7px 12px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
h1{font-family:var(--display);color:var(--accent);font-size:clamp(28px,5vw,36px);margin:20px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.idx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.idx h2{font-family:var(--display);font-size:20px;margin:0 0 6px}
.idx ol{list-style:none;margin:0;padding:0;columns:2;column-gap:24px}
.idx li{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:6px;padding:3px 0;border-bottom:1px dotted var(--line);break-inside:avoid;font-size:14.5px}
.idx .no,.jid{font-family:var(--mono);font-weight:500;color:var(--accent)}
.idx .pg{font-family:var(--mono);color:var(--muted);text-align:right}
.sheet{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;break-inside:avoid}
.jh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:8px}
.jh .jt{font-family:var(--display);font-size:20px;font-weight:700}
.jh .num{font-family:var(--mono);font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:1px 9px}
.meta{color:var(--muted);font-size:14.5px;width:100%}.due{color:var(--money);font-weight:700;font-size:14.5px;width:100%}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.cols{grid-template-columns:1fr}.idx ol{columns:1}}
.col h3{font-family:var(--display);font-size:15px;margin:0 0 4px;letter-spacing:.03em;text-transform:uppercase}
.col.c h3{color:var(--ok)}.col.y h3{color:var(--owner)}
.it{display:grid;grid-template-columns:22px 44px minmax(0,1fr);gap:4px;padding:4px 0;border-bottom:1px solid var(--line);font-size:15px}
.it:last-child{border-bottom:0}.cb{font-size:18px;line-height:1.1}.iid{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.mz{margin-top:8px;background:var(--money-soft);border:1px dashed var(--money);border-radius:8px;padding:6px 10px;font-size:14.5px;color:var(--money)}
.mz button{font-size:13px;padding:3px 9px;margin-left:6px}
.lockbox{display:none;margin-top:6px}.lockbox.show{display:flex;gap:6px;align-items:center}
.lockbox input{width:6em;font-family:var(--mono);font-size:18px;text-align:center;border:2px solid var(--money);border-radius:6px;background:var(--surface);color:var(--ink)}
.foot{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;margin-top:6px}
@media print{@page{size:Letter;margin:.5in}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff;font-size:13.5px}.bar,.noprint,.mz button,.lockbox{display:none!important}
.idx{break-after:page}.sheet{break-after:page;margin:0}.sheet:last-child{break-after:auto}.job{border-color:#ccc}}
</style>
<div class="bar noprint"><b>Layout:</b><button id="m1">1 job per page</button><button id="m2" class="on">2 small jobs per page</button><span style="flex:1"></span><span id="lockst" style="font-size:14px;color:var(--money);font-weight:700">🔒 Money locked</span></div>
<div class="wrap">

</div>

var mode=2,unlocked=false;function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function size(j){return j.me.length+j.you.length+(j.due?1:0)}
function sheets(){var out=[],i=0;while(i<JOBS.length){var a=JOBS[i],b=JOBS[i+1];if(mode===2&&b&&size(a)+size(b)<=12){out.push([i,i+1]);i+=2}else{out.push([i]);i++}}return out}
function item(code,t){return '<div class="it"><span class="cb">☐</span><span class="iid">'+code+'</span><span>'+esc(t)+'</span></div>'}
function card(j,k){var id='J-'+String(k+1).padStart(2,'0');var h='<section class="job" id="'+id+'"><div class="jh"><span class="jid">'+id+'</span><span class="jt">'+esc(j.t)+'</span><span class="num">'+esc(j.n)+'</span>'+(j.who?'<span class="meta">'+esc(j.who)+'</span>':'')+(j.due?'<span class="due">⏰ '+esc(j.due)+'</span>':'')+'</div><div class="cols"><div class="col c"><h3>Claude does</h3>'+j.me.map(function(t,x){return item('C'+(x+1),t)}).join('')+'</div><div class="col y"><h3>You do</h3>'+j.you.map(function(t,x){return item('Y'+(x+1),t)}).join('')+'</div></div>';
if(j.money.length){h+=unlocked?'<div class="mz">🔓 Money: '+j.money.map(function(t,x){return '<div class="it"><span class="cb">☐</span><span class="iid">M'+(x+1)+'</span><span>'+esc(t)+'</span></div>'}).join('')+'</div>':'<div class="mz noprint">🔒 '+j.money.length+' money item(s) locked <button onclick="ask()">Open with 0000</button></div>'}
return h+'</section>'}
function draw(){var S=sheets(),idx='',sh='';S.forEach(function(s,p){sh+='<div class="sheet">'+s.map(function(k){return card(JOBS[k],k)}).join('')+'</div>';s.forEach(function(k){idx+='<li><span class="no">J-'+String(k+1).padStart(2,'0')+'</span><span>'+esc(JOBS[k].t)+'</span><span class="pg">p.'+(p+2)+'</span></li>'})});
document.getElementById('idx').innerHTML=idx;document.getElementById('sheets').innerHTML=sh;document.getElementById('m1').className=mode===1?'on':'';document.getElementById('m2').className=mode===2?'on':'';
document.getElementById('lockst').innerHTML=unlocked?'🔓 Money open <button onclick="unlocked=false;draw()">Lock again</button>':'🔒 Money locked'}
function ask(){var b=document.getElementById('lb');b.classList.add('show');document.getElementById('pin').focus()}
document.getElementById('m1').onclick=function(){mode=1;draw()};document.getElementById('m2').onclick=function(){mode=2;draw()};

lb.onsubmit=function(e){e.preventDefault();if(document.getElementById('pin').value==='0000'){unlocked=true;lb.classList.remove('show');draw()}else{document.getElementById('perr').textContent='Not the zone code.'}document.getElementById('pin').value=''};
